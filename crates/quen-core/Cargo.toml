[package]
name = "quen-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Platform-neutral logic for quen"

# Every cloud piece uses only these; add one only when it is truly needed and say so in the report.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
half = "2.7"
png = "0.18"
exr = "1.74"
# The game-data readers: zlib entries and crc32s. Both were in the tree already (through png).
flate2 = "1"
crc32fast = "1"
