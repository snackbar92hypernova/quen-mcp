[package]
name = "quen"
version = "0.1.26"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "quen: the MCP server (stdio proxy + daemon) and the Windows layer that drives a game session for mod development, testing and troubleshooting"

# MCP is a small JSON-RPC loop over serde_json, not an SDK: five methods need no async runtime, and session steps stay
# on one OS thread.
[dependencies]
quen-core = { path = "../quen-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
# The capture module: WinRT (Windows.Graphics.Capture) and COM (D3D11, DXGI) need the projections, which
# windows-sys lacks. half and png are quen-core's own, for the FP16 readback and the 8-bit SDR PNG.
windows = { version = "0.62", features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
half = "2.7"
png = "0.18"

# The concurrency tests hold the ledger open from outside quen, as a viewer or script would (quen-core's own SQLite).
[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
# The data tools' tests write their synthetic bundles' and CR2W files' crc32s (quen-core's own).
crc32fast = "1"
